services:
  smartvision_client:
    build: .
    container_name: smartvision_client
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host # Permette al container di usare la rete dell'host
    stdin_open: true # Abilita l'interattività
    tty: true # Abilita l'accesso a una TTY (Terminale Virtuale)
  ntp_server:
    image: cturra/ntp:latest
    container_name: ntp_server
    ports:
      - "123:123/udp"
    environment:
      - NTP_SERVERS=127.127.1.1
