services:
  qt-app:
    build: .
    container_name: qt-app
    environment:
      - SOURCE_IP=192.168.1.9
      - RTSP_PORT=8554
      - UDP_PORT=5005
      - DISPLAY=${DISPLAY}
      - PULSE_SERVER=unix:/run/user/${UID}/pulse/native
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/user/${UID}/pulse:/run/user/${UID}/pulse
      - /run/user/${UID}/pulse/native:/run/user/${UID}/pulse/native
    devices:
      - /dev/snd
    network_mode: host # Permette al container di usare la rete dell'host
    stdin_open: true # Abilita l'interattività
    tty: true # Abilita l'accesso a una TTY (Terminale Virtuale)
